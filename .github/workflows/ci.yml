name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit and API tests
        run: pytest -q
      - name: Safety eval (rules baseline, no API key needed)
        run: python -m evals.run --provider rules --fail-on-unsafe
      - name: Retrieval eval (BM25, no model needed)
        run: python -m evals.retrieval --modes bm25
      - name: Docker build
        run: docker build -t rx-intake-agent .
