[project]
name = "rx-intake-agent"
version = "0.1.0"
description = "Prescription intake workflow: LLM extraction, deterministic safety rules, human review, evals."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["rx_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
